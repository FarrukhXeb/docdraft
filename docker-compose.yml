services:
  db:
    image: postgres:16-alpine
    container_name: docdraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docdraft
      POSTGRES_PASSWORD: docdraft
      POSTGRES_DB: docdraft
    ports:
      # Host 5433 -> container 5432 to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - docdraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docdraft -d docdraft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docdraft_pgdata:
